<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>readit · sign in</title>
    <link rel="stylesheet" href="/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='5' y='1' width='6' height='14' rx='1.5' fill='%23c2410c'/%3E%3C/svg%3E"
    />
  </head>
  <body class="login">
    <form class="login-card" method="get" action="/">
      <div class="brand"><span class="mark" aria-hidden="true"></span>readit</div>
      <p class="muted">
        This dashboard only opens with its access token. Open the link printed by
        <code>pnpm dashboard</code>, or paste the token below.
      </p>
      <label class="field">
        Access token
        <input type="text" name="token" autocomplete="off" spellcheck="false" required autofocus />
      </label>
      <button class="btn primary" type="submit">Open dashboard</button>
      <p class="hint">
        The token is saved in <code>~/.config/readit/dashboard.token</code> and stays the same
        across restarts, so the printed link can be bookmarked.
      </p>
    </form>
  </body>
</html>
